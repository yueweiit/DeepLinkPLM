services:
  redis:
    image: redis:7-alpine
    container_name: plm-redis
    command: redis-server --appendonly yes
    volumes:
      - plm_redisdata:/data
    restart: unless-stopped
    networks:
      - plm-net

  server:
    image: ${PLM_SERVER_IMAGE:-yuewei-plm-server}
    build: &server-build
      context: ./plm-server
      dockerfile: Dockerfile
      target: ${SERVER_BUILD_TARGET:-runtime}
      args:
        BUILD_IMAGE: ${SERVER_BUILD_IMAGE:-maven:3.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${SERVER_RUNTIME_IMAGE:-eclipse-temurin:17-jre}
        JAR_FILE: ${SERVER_JAR_FILE:-target/*.jar}
    container_name: plm-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_SECURITY_ENABLED: "${APP_SECURITY_ENABLED:-true}"
      APP_SECURITY_DEV_TOKEN: "${APP_SECURITY_DEV_TOKEN:-dev-token}"
      APP_STORAGE_LOCAL_ROOT: data/uploads
      TZ: Asia/Shanghai
      APP_MASTER_DATA_ENABLED: "${APP_MASTER_DATA_ENABLED:-false}"
      APP_MASTER_DATA_SNAPSHOT_ROOT: /app/data/master-data
      APP_MOLD_SALES_ROOT: /app/data/mold-sales
      APP_MOLD_SALES_EXPORTER: /opt/plm/scripts/export_mold_sales.py
      APP_MOLD_SALES_SSH_HOST: "${APP_MOLD_SALES_SSH_HOST:-${PLM_SOURCE_SSH_HOST:-yuewei@155.138.234.129}}"
      APP_MOLD_SALES_PASSWORD_FILE: "${APP_MOLD_SALES_PASSWORD_FILE:-${PLM_SOURCE_SSH_PASSWORD_FILE:-}}"
      APP_MOLD_APPLICATION_ENABLED: "${APP_MOLD_APPLICATION_ENABLED:-false}"
      APP_MOLD_APPLICATION_READ_SYNC_ENABLED: "${APP_MOLD_APPLICATION_READ_SYNC_ENABLED:-false}"
      APP_MOLD_APPLICATION_WRITE_ENABLED: "${APP_MOLD_APPLICATION_WRITE_ENABLED:-false}"
      APP_MOLD_APPLICATION_CENTRAL_CODE_ENABLED: "${APP_MOLD_APPLICATION_CENTRAL_CODE_ENABLED:-false}"
      APP_MOLD_APPLICATION_ALLOWED_SUBMITTERS: "${APP_MOLD_APPLICATION_ALLOWED_SUBMITTERS:-}"
      APP_MOLD_APPLICATION_PROCESS_CODE: "${APP_MOLD_APPLICATION_PROCESS_CODE:-PROC-89949932-19DE-48EB-A20B-2595CB0F804D}"
      APP_MOLD_APPLICATION_CONNECTOR_TOKEN: "${APP_MOLD_APPLICATION_CONNECTOR_TOKEN:-}"
      APP_MOLD_APPLICATION_CALLBACK_SIGNATURE_TOKEN: "${APP_MOLD_APPLICATION_CALLBACK_SIGNATURE_TOKEN:-}"
      APP_MOLD_APPLICATION_CALLBACK_AES_KEY: "${APP_MOLD_APPLICATION_CALLBACK_AES_KEY:-}"
      APP_MOLD_APPLICATION_CALLBACK_OWNER_KEY: "${APP_MOLD_APPLICATION_CALLBACK_OWNER_KEY:-}"
      APP_MOLD_APPLICATION_IMPORT_DIRECTORY: /app/data/mold-applications
      APP_MOLD_APPLICATION_SYNC_INTERVAL_MS: "${APP_MOLD_APPLICATION_SYNC_INTERVAL_MS:-900000}"
      DINGTALK_INTEGRATION_ENABLED: "${DINGTALK_INTEGRATION_ENABLED:-true}"
      DINGTALK_CORP_ID: "${DINGTALK_CORP_ID:-}"
      DINGTALK_AGENT_ID: "${DINGTALK_AGENT_ID:-}"
      DINGTALK_PRODUCT_LINE_PROCESS_CODE: "${DINGTALK_PRODUCT_LINE_PROCESS_CODE:-PROC-88C58F86-D55A-4A04-BA6E-CB71071F0468}"
      DINGTALK_SHIP_MOLD_PROCESS_CODE: "${DINGTALK_SHIP_MOLD_PROCESS_CODE:-}"
      DINGTALK_MODEL_VARIANT_PROCESS_CODE: "${DINGTALK_MODEL_VARIANT_PROCESS_CODE:-PROC-BD65F530-F66F-46B9-8F72-0567DD68F60C}"
      DINGTALK_APP_KEY: "${DINGTALK_APP_KEY:-}"
      DINGTALK_APP_SECRET: "${DINGTALK_APP_SECRET:-}"
      DINGTALK_CALLBACK_TOKEN: "${DINGTALK_CALLBACK_TOKEN:-}"
      DINGTALK_AUTO_APPROVER_USER_ID: "${DINGTALK_AUTO_APPROVER_USER_ID:-}"
      DINGTALK_PRODUCT_LINE_CC_USER_IDS: "${DINGTALK_PRODUCT_LINE_CC_USER_IDS:-}"
      DINGTALK_OUTBOUND_ENDPOINT: "${DINGTALK_OUTBOUND_ENDPOINT:-}"
      APP_PHONE_WATCH_ENABLED: "${APP_PHONE_WATCH_ENABLED:-false}"
      APP_PHONE_WATCH_BASE_URL: "${APP_PHONE_WATCH_BASE_URL:-http://phone-watch:8000}"
      APP_PHONE_WATCH_TOKEN: "${PHONE_WATCH_INTERNAL_TOKEN:-}"
      APP_PHONE_WATCH_CONNECT_TIMEOUT_MS: "${APP_PHONE_WATCH_CONNECT_TIMEOUT_MS:-2000}"
      APP_PHONE_WATCH_READ_TIMEOUT_MS: "${APP_PHONE_WATCH_READ_TIMEOUT_MS:-10000}"
    volumes:
      - plm_uploads:/app/data/uploads
      - plm_master_data:/app/data/master-data:ro
      - plm_mold_sales:/app/data/mold-sales
      - plm_mold_application_sources:/app/data/mold-applications:ro
      - &integration-scripts
        type: bind
        source: ./scripts
        target: /opt/plm/scripts
        read_only: true
        bind:
          create_host_path: false
      - &integration-ssh
        type: bind
        source: ${PLM_INTEGRATION_SSH_DIRECTORY:-/var/lib/yuewei-plm/integration-ssh}
        target: /home/plm/.ssh
        read_only: true
        bind:
          create_host_path: false
      - &integration-secrets
        type: bind
        source: ${PLM_INTEGRATION_SECRET_DIRECTORY:-/var/lib/yuewei-plm/integration-secrets}
        target: /run/plm-secrets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - plm-net

  master-data-sync:
    profiles: [integrations]
    image: ${PLM_SERVER_IMAGE:-yuewei-plm-server}
    build: *server-build
    environment:
      TZ: Asia/Shanghai
      PLM_SOURCE_SSH_PASSWORD_FILE: "${PLM_SOURCE_SSH_PASSWORD_FILE:-}"
    entrypoint: [python3, /opt/plm/scripts/export_master_data_snapshot.py]
    command:
      - --ssh-host
      - "${PLM_SOURCE_SSH_HOST:-yuewei@155.138.234.129}"
      - --output-root
      - /app/data/master-data
      - --interval-seconds
      - "${PLM_MASTER_DATA_SYNC_INTERVAL_SECONDS:-900}"
    volumes:
      - plm_master_data:/app/data/master-data
      - *integration-scripts
      - *integration-ssh
      - *integration-secrets
    restart: unless-stopped
    networks:
      - plm-net

  phone-watch:
    build:
      context: ./services/phone-watch
    container_name: phone-watch
    environment: &phone-watch-environment
      TZ: Asia/Shanghai
      PHONE_WATCH_DB_BACKEND: postgres
      PHONE_WATCH_PG_DRIVER: pg8000
      PHONE_WATCH_PG_HOST: "${PHONE_WATCH_PG_HOST:-}"
      PHONE_WATCH_PG_DATABASE: "${PHONE_WATCH_PG_DATABASE:-phone_scraper}"
      PHONE_WATCH_PG_USER: "${PHONE_WATCH_PG_USER:-postgres}"
      PHONE_WATCH_PG_PASSWORD: "${PHONE_WATCH_PG_PASSWORD:-}"
      PHONE_WATCH_PG_PORT: "${PHONE_WATCH_PG_PORT:-5432}"
      PHONE_WATCH_LOCAL_ONLY: "false"
      PHONE_WATCH_INTERNAL_TOKEN: "${PHONE_WATCH_INTERNAL_TOKEN:-}"
      PHONE_WATCH_LEGACY_API_ENABLED: "false"
      PHONE_WATCH_DINGTALK_WRITE_ENABLED: "false"
    volumes:
      - phone_watch_data:/app/data
      - phone_watch_logs:/app/logs
    command: ["python", "-m", "phone_watch", "serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    networks:
      - plm-net

  phone-watch-worker:
    build:
      context: ./services/phone-watch
    container_name: phone-watch-worker
    environment: *phone-watch-environment
    volumes:
      - phone_watch_data:/app/data
      - phone_watch_logs:/app/logs
    command: ["python", "-m", "phone_watch", "schedule", "--hour", "8", "--minute", "0"]
    restart: unless-stopped
    networks:
      - plm-net

  web:
    build:
      context: ./plm-web
      dockerfile: Dockerfile
    container_name: plm-web
    ports:
      - "${WEB_PORT:-8111}:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - plm-net

networks:
  plm-net:
    driver: bridge

volumes:
  plm_redisdata:
  plm_uploads:
  plm_master_data:
  plm_mold_sales:
  plm_mold_application_sources:
  phone_watch_data:
  phone_watch_logs:
